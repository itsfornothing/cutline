apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    app.kubernetes.io/name: cutline-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.workers.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cutline-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cutline-worker
    spec:
      {{- with .Values.workers.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.workers.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.workers.image.repository }}:{{ .Values.workers.image.tag }}"
          imagePullPolicy: {{ .Values.workers.image.pullPolicy }}
          env:
            - name: RUST_LOG
              value: {{ .Values.config.logLevel | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-secret
                  key: database-url
            - name: WORKER_HEARTBEAT_SEC
              value: {{ .Values.config.workerHeartbeatSec | quote }}
            - name: SAFE_FETCHER_MAX_BYTES
              value: {{ .Values.config.safeFetcherMaxBytes | quote }}
          resources:
            {{- toYaml .Values.workers.resources | nindent 12 }}
          volumeMounts:
            - name: scratch-storage
              mountPath: /tmp/cutline
      volumes:
        - name: scratch-storage
          emptyDir:
            sizeLimit: 20Gi
