# Default values for Cutline Kubernetes deployment.

global:
  environment: production
  region: us-east-1

api:
  replicaCount: 3
  image:
    repository: ghcr.io/cutline/api
    tag: "v0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 75

workers:
  replicaCount: 8
  image:
    repository: ghcr.io/cutline/worker
    tag: "v0.1.0"
    pullPolicy: IfNotPresent
  gpu:
    enabled: true
    count: 1
    type: "nvidia.com/gpu"
  resources:
    limits:
      nvidia.com/gpu: 1
      cpu: 4000m
      memory: 8Gi
    requests:
      nvidia.com/gpu: 1
      cpu: 2000m
      memory: 4Gi
  nodeSelector:
    accelerator: nvidia-tesla-t4
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"
  autoscaling:
    queueDepthThreshold: 10
    minWorkers: 4
    maxWorkers: 64

database:
  host: postgres-cluster.internal
  port: 5432
  name: cutline
  user: cutline_app
  sslMode: require

config:
  logLevel: info
  workerHeartbeatSec: 5
  reaperTimeoutSec: 45
  zombieMaxRetries: 3
  safeFetcherMaxBytes: 524288000 # 500 MB
