apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cutline-worker-isolation
  namespace: cutline
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: worker
  policyTypes:
    - Ingress
    - Egress
  ingress: [] # No incoming connections allowed into worker pods
  egress:
    # 1. Internal Postgres database
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    # 2. Allow-listed Egress HTTP/HTTPS Fetch Proxy for user assets
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: egress-proxy
      ports:
        - protocol: TCP
          port: 3128
    # 3. AWS S3 Storage endpoint
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    # 4. Cluster DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
