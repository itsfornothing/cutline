[workspace]
resolver = "3"
members = [
    "crates/schema",
    "crates/compositor",
    "crates/audio",
    "crates/cli",
    "crates/scheduler",
    "crates/worker",
    "crates/api",
    "crates/captions",
    "crates/reframe",
    "crates/provenance",
    "tools/cutline-bench",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1


[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# Cutline internal crates
cutline-schema = { path = "crates/schema" }
cutline-compositor = { path = "crates/compositor" }
cutline-audio = { path = "crates/audio" }
cutline-scheduler = { path = "crates/scheduler" }
cutline-worker = { path = "crates/worker" }
cutline-api = { path = "crates/api" }
cutline-captions = { path = "crates/captions" }
cutline-reframe = { path = "crates/reframe" }
cutline-provenance = { path = "crates/provenance" }

# Serialization and Schema
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.2", features = ["derive"] }

# Async & utilities
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.11"
url = "2.5"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
axum = { version = "0.8", features = ["macros", "tokio"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
