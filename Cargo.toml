[workspace]
resolver = "3"
members = [
    "crates/schema",
    "crates/compositor",
    "crates/audio",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# Cutline internal crates
cutline-schema = { path = "crates/schema" }
cutline-compositor = { path = "crates/compositor" }
cutline-audio = { path = "crates/audio" }

# Serialization and Schema
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.2", features = ["derive"] }

# Async & utilities
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.11"
url = "2.5"
